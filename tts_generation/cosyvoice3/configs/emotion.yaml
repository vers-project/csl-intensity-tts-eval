# CosyVoice 3, emotion experiment.
#
# Control = acoustic prompt.  For each RAVDESS actor, one clip per emotion is the prompt;
# the neutral clip of the same actor is the anchor.  Every (actor, sentence, seed) is
# generated under all 8 conditions.
#
# Text = the two RAVDESS statements, so the natural RAVDESS recordings and the TTS outputs
# say the same words.  Prompts are CROSSED: the "kids" sentence is synthesised from the
# actor's "dogs" clip and vice versa, so the model never hears its own target sentence in
# the prompt.
#
#   24 actors × 2 sentences × 8 conditions = 384 samples per seed job, 1536 in total (4 seeds).
#
# Paths starting with /path/to/ are placeholders: point them at your own copies.
#
# Run with:
#   uv run launch_experiment --script generate_parallel.py --config configs/emotion.yaml
experiment: emotion

# --- Model ---
model_dir: /path/to/pretrained_models/Fun-CosyVoice3-0.5B
fp16: false
# CosyVoice 3 zero-shot needs this prefix before the prompt transcript (assertion in llm.py).
system_prompt: "You are a helpful assistant.<|endofprompt|>"

# --- Text: the two RAVDESS statements ---
sentences:
  kids: "Kids are talking by the door"
  dogs: "Dogs are sitting by the door"

# --- Speakers and prompts (RAVDESS; same block in the IndexTTS2 emotion config) ---
# Clips always come from the statement NOT being synthesised (crossed prompts).
# CosyVoice 3 uses the condition clip as its prompt.
ravdess:
  metadata_csv: /path/to/metadata/ravdess_metadata.csv
  root:         /path/to/RAVDESS/
  actors: all                                     # all 24 RAVDESS actors
  repetition: 1
  intensity: strong                               # neutral has no strong take: normal is used

# --- Conditions (RAVDESS emotion labels; the anchor is the neutral clip) ---
anchor: neutral
conditions: [neutral, calm, happy, sad, angry, fearful, disgust, surprised]

# --- Sampling ---
# Each sample is generated with the RNG re-seeded to `seed` right before it, so the
# 8 conditions of one (actor, sentence) share the same random draws as far as possible.
seed: 0                                           # swept below: one job per seed

dry_run: false                                    # true = write manifest.csv only

# --- Output (columns: generation_design/design.py) ---
#   output_dir/manifest.csv, generation_log.csv
#   output_dir/audio/{speaker_id}/{sentence_id}/{condition}.wav      (32-bit float)
launcher:
  output_dir: /path/to/outputs/tts_generation/cosyvoice3/emotion
  sweep:
    cartesian:
      seed: [0, 1, 2, 3]
  device_launcher:
    device: local
