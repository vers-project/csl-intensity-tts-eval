# Alpha ratio and SPL label of every window the predictors are scored on, then the tilt-only
# baseline fit (linear and cubic, on AVID train) and its test metrics.
#
# Inputs = those of the evaluation predictor (job 3 of train_predictor_grid.yaml: WavLM
# Base+ layer 3, seed 0): its config.yaml gives the metadata CSV, dataset roots, label
# window, speech detection and sliding windows, and the loader is the predictor's eval
# loader.  Every metadata row is used (all splits of AVID, VIC, FLombard).  The job writes
# window_tilt.npz, window_tilt_utterances.csv, metrics.csv and fits.json.
#
# Paths starting with /path/to/ are placeholders: point them at your own copies.
#
# Run from a clone of vocal-intensity-prediction:
#   uv run --extra cu128 launch_experiment --config <this file> --script scripts/extract_window_tilt.py
# The Hammarberg-index baseline and the alpha-ratio rows of the results table are refits on
# the same extraction (no audio is read again):
#   uv run --extra cpu python scripts/fit_tilt_baseline.py <job dir> --feature alpha --degrees 1 3 --output-dir <job dir>/alpha
#   uv run --extra cpu python scripts/fit_tilt_baseline.py <job dir> --feature hammarberg --degrees 1 3 --output-dir <job dir>/hammarberg
training_config: /path/to/outputs/intensity_prediction/<date>/<time>/3/config.yaml
num_workers: 8
degrees: [1, 3]
feature: alpha

launcher:
  output_dir: /path/to/outputs/window_tilt
  device_launcher:
    device: local
